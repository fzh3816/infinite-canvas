services:
  app:
    image: infinite-canvas:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8300:8300"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8300/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
