server {
    listen 8300;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # 代理各渠道定价接口，具体路径由前端提供方配置选择。
    location = /proxy/lingyun-pricing {
        set $pricing_service new-api:3000;
        resolver 127.0.0.11 valid=30s ipv6=off;
        proxy_pass http://$pricing_service/api/pricing;
        proxy_set_header Host new-api;
    }

    location = /proxy/nuona-pricing {
        set $pricing_service new-api-nuona:3000;
        resolver 127.0.0.11 valid=30s ipv6=off;
        proxy_pass http://$pricing_service/api/pricing;
        proxy_set_header Host new-api-nuona;
    }
}
