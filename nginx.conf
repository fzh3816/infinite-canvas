server {
    listen 8300;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # 代理灵云定价接口，解决浏览器跨域限制。
    location = /proxy/lingyun-pricing {
        proxy_pass http://new-api:3000/api/pricing;
        proxy_set_header Host new-api;
    }
}
